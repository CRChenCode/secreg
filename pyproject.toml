[project]
name = "secreg"
version = "0.1.0"
description = "Mechanistic diagnosis of security regression in coding agents"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "safetensors",
    "datasets",
    "tqdm",
]

[project.optional-dependencies]
# Full GPU-side stack (Skipjack only, Linux x86_64 — vllm has no macOS/ARM wheels,
# so this extra is marked Linux-only to keep local `uv sync` on a laptop from
# trying to build it from source).
gpu = [
    "torch",
    "transformers",
    "accelerate",
    "vllm>=0.6; platform_system == 'Linux'",
    "nnsight",
]
# Alfonso's local machine: CPU-only, no vllm/torch-cuda. `torch` here resolves
# to the CPU wheel via the index priorities below.
cpu = [
    "torch",
    "transformers",
    "tokenizers",
]
dev = [
    "pytest",
    "ruff",
    "black",
    "pre-commit",
    "semgrep",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secreg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
